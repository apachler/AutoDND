name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax-check the script
        run: python -m py_compile files/autodnd
      - name: Install coverage
        run: pip install coverage
      - name: Run unit tests with coverage
        run: python -m coverage run --include='*/autodnd' -m unittest discover -s tests -v
      - name: Enforce >=80% coverage
        run: python -m coverage report -m --fail-under=80
